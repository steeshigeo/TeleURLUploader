<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Store — iOS IPA Mod Catalog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    
    body {
      background-color: #000000;
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    
    /* Shape Squircle iOS untuk Icon */
    .ios-icon {
      border-radius: 22%;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(255, 255, 255, 0.12);
    }

    /* Glassmorphism khas macOS / iOS */
    .ios-glass {
      background: rgba(28, 28, 30, 0.65);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .ios-card {
      background: rgba(28, 28, 30, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .ios-input {
      background: rgba(44, 44, 46, 0.8);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }
  </style>
</head>
<body class="min-h-screen pb-16">

  <!-- Navigation Bar Khas App Store -->
  <nav class="sticky top-0 z-50 ios-glass border-b border-white/10 px-4 py-3.5 mb-6">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-500 to-sky-400 flex items-center justify-center shadow-lg shadow-blue-500/20">
          <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.85c.66-.8 1.11-1.92.99-3.04-.96.04-2.13.64-2.82 1.44-.61.71-1.14 1.86-1 2.97 1.08.08 2.17-.57 2.83-1.37z"/></svg>
        </div>
        <div>
          <span class="text-xs font-semibold uppercase tracking-wider text-blue-400 block -mb-1">App Store</span>
          <span class="text-base font-extrabold text-white">IPA Mod Library</span>
        </div>
      </div>

      <a href="https://t.me/steeshigeo" target="_blank" 
         class="px-4 py-1.5 rounded-full bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs transition duration-200 shadow-md shadow-blue-600/30 flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.25-5.54 3.69-.52.36-1 .53-1.42.52-.47-.01-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.88.03-.25.38-.51 1.07-.78 4.18-1.82 6.97-3.02 8.36-3.61 3.98-1.68 4.81-1.97 5.35-1.98.12 0 .38.03.55.17.14.12.18.28.2.45-.02.07-.02.16-.04.29z"/></svg>
        Join Telegram
      </a>
    </div>
  </nav>

  <main class="px-4 max-w-6xl mx-auto">
    <!-- Featured Hero Banner (Today Tab Style) -->
    <section class="mb-8">
      <div class="relative overflow-hidden rounded-3xl ios-card p-6 md:p-8 border border-white/10 bg-gradient-to-br from-indigo-900/40 via-purple-900/20 to-black">
        <div class="relative z-10 max-w-2xl">
          <span class="text-xs font-bold tracking-widest text-blue-400 uppercase">EXCLUSIVE RELEASES</span>
          <h1 class="text-3xl md:text-5xl font-black text-white mt-1 mb-3 leading-tight tracking-tight">
            Premium iOS Mods & Tweaked IPAs
          </h1>
          <p class="text-slate-300 text-sm md:text-base leading-relaxed mb-6">
            Katalog aplikasi iOS ter-update otomatis secara real-time. Dapatkan akses file <code>.ipa</code> lengkap beserta sertifikat sideloading di grup Telegram.
          </p>
          <a href="https://t.me/steeshigeo" target="_blank" 
             class="inline-flex items-center gap-2 px-6 py-3 rounded-full bg-white text-black font-bold text-sm hover:bg-slate-200 transition shadow-xl">
            <span>Dapatkan VIP Access</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
          </a>
        </div>
        <div class="absolute -right-10 -bottom-10 w-64 h-64 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>
      </div>
    </section>

    <!-- Search & Filter Controls -->
    <section class="mb-8 flex flex-col md:flex-row gap-4 items-center justify-between">
      <div class="relative w-full md:w-96">
        <input type="text" id="searchInput" onkeyup="filterApps()" placeholder="Cari aplikasi, mod, atau fitur..." 
               class="w-full pl-10 pr-4 py-2.5 rounded-xl ios-input text-white placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition">
        <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      </div>

      <div class="flex items-center gap-2 w-full md:w-auto overflow-x-auto pb-1 md:pb-0">
        <button onclick="filterCategory('all')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-blue-600 text-white border border-blue-500 shadow-sm whitespace-nowrap">Semua</button>
        <button onclick="filterCategory('patched')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white/5 text-slate-300 hover:bg-white/10 border border-white/10 whitespace-nowrap">Patched</button>
        <button onclick="filterCategory('tweaked')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white/5 text-slate-300 hover:bg-white/10 border border-white/10 whitespace-nowrap">Tweaked</button>
        <div id="appCounter" class="text-xs text-slate-400 font-medium px-3 py-1.5 rounded-full bg-white/5 border border-white/5 ml-auto whitespace-nowrap">0 Apps</div>
      </div>
    </section>

    <!-- App Grid -->
    <section id="catalogGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <div class="col-span-full text-center py-20">
        <div class="inline-block w-8 h-8 border-3 border-blue-500 border-t-transparent rounded-full animate-spin mb-3"></div>
        <p class="text-slate-400 text-xs font-medium">Memuat App Store Catalog...</p>
      </div>
    </section>
  </main>

  <script>
    let allApps = [];
    let currentCategory = 'all';

    async function loadCatalog() {
      try {
        const res = await fetch('/data/apps.json?t=' + new Date().getTime());
        if (!res.ok) throw new Error("Catalog data not found");
        allApps = await res.json();
        
        if (!Array.isArray(allApps) || allApps.length === 0) {
          renderEmptyState("Belum ada aplikasi yang dirilis.");
          return;
        }

        document.getElementById('appCounter').innerText = `${allApps.length} Apps`;
        renderCatalog(allApps);
      } catch (err) {
        renderEmptyState("Katalog sedang diperbarui atau belum ada data.");
      }
    }

    function renderEmptyState(msg) {
      const grid = document.getElementById('catalogGrid');
      grid.innerHTML = `
        <div class="col-span-full text-center py-16 ios-card rounded-3xl p-8 max-w-sm mx-auto">
          <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-white/5 flex items-center justify-center border border-white/10 text-3xl">
            📲
          </div>
          <h3 class="text-white font-bold text-base mb-1">App Store Catalog</h3>
          <p class="text-slate-400 text-xs">${msg}</p>
        </div>
      `;
    }

    function renderCatalog(apps) {
      const grid = document.getElementById('catalogGrid');
      grid.innerHTML = apps.map(app => `
        <div class="ios-card rounded-3xl p-5 flex flex-col justify-between hover:border-blue-500/40 transition duration-300">
          <div>
            <!-- Header Card: Icon + App Name + GET Button -->
            <div class="flex items-center gap-3.5 mb-4">
              <img src="${app.thumbnail || 'https://via.placeholder.com/120?text=IPA'}" 
                   class="w-16 h-16 ios-icon object-cover shrink-0">
              <div class="overflow-hidden flex-1">
                <h3 class="font-bold text-base text-white truncate leading-snug mb-0.5">${app.app_name}</h3>
                <p class="text-xs text-slate-400 truncate mb-1">${app.modified_by ? 'By ' + app.modified_by : 'iOS App'}</p>
                <div class="flex items-center gap-1.5 flex-wrap">
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-blue-500/20 text-blue-400 border border-blue-500/30">v${app.version}</span>
                  <span class="text-[10px] font-medium px-2 py-0.5 rounded-md bg-white/5 text-slate-400 border border-white/5">iOS ${app.min_ios}+</span>
                  ${app.is_patched ? '<span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">Patched</span>' : ''}
                </div>
              </div>
              <a href="https://t.me/steeshigeo" target="_blank" 
                 class="px-4 py-1.5 rounded-full bg-white/10 hover:bg-blue-600 hover:text-white text-blue-400 font-extrabold text-xs transition duration-200 tracking-wide uppercase shrink-0">
                GET
              </a>
            </div>

            <!-- Mod Features Pill Box -->
            ${app.modified ? `
              <div class="mb-3 p-3 rounded-2xl bg-white/[0.03] border border-white/5">
                <span class="text-[10px] font-extrabold text-blue-400 uppercase tracking-wider block mb-1">MOD FEATURES</span>
                <p class="text-xs font-semibold text-slate-200 leading-snug">${app.modified}</p>
              </div>
            ` : ''}

            <!-- Note Box (iOS Sheet Style) -->
            ${app.note ? `
              <div class="p-3 rounded-2xl bg-black/40 border border-white/5 text-[11px] text-slate-300 whitespace-pre-wrap max-h-36 overflow-y-auto leading-relaxed font-sans">
                ${app.note}
              </div>
            ` : ''}
          </div>

          <!-- Footer Card -->
          <div class="mt-4 pt-3 border-t border-white/5 flex justify-between items-center text-[11px] text-slate-400 font-medium">
            <span>Updated ${app.updated_at}</span>
            <a href="https://t.me/steeshigeo" target="_blank" class="text-blue-400 hover:underline font-semibold flex items-center gap-1">
              Download IPA ➔
            </a>
          </div>
        </div>
      `).join('');
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('bg-blue-600', 'text-white', 'border-blue-500');
        btn.classList.add('bg-white/5', 'text-slate-300', 'border-white/10');
      });
      event.target.classList.remove('bg-white/5', 'text-slate-300', 'border-white/10');
      event.target.classList.add('bg-blue-600', 'text-white', 'border-blue-500');

      filterApps();
    }

    function filterApps() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      let filtered = allApps.filter(app => {
        const matchesQuery = app.app_name.toLowerCase().includes(query) || 
                             (app.modified && app.modified.toLowerCase().includes(query)) ||
                             (app.note && app.note.toLowerCase().includes(query));

        if (currentCategory === 'patched') return matchesQuery && app.is_patched;
        if (currentCategory === 'tweaked') return matchesQuery && app.tweaker;
        return matchesQuery;
      });

      if (filtered.length === 0) {
        renderEmptyState(`Tidak ditemukan aplikasi yang sesuai.`);
      } else {
        renderCatalog(filtered);
      }
    }

    loadCatalog();
  </script>
</body>
</html>
