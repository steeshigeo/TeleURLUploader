<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPA Mod Library Catalog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: radial-gradient(circle at top left, #1e1b4b, #0f172a, #020617);
      min-height: 100vh;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
  </style>
</head>
<body class="px-4 py-8 max-w-6xl mx-auto">
  <!-- Header -->
  <header class="text-center mb-10">
    <h1 class="text-4xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-500 mb-2">
      iOS IPA Mod Catalog
    </h1>
    <p class="text-slate-400 text-sm max-w-md mx-auto">
      Katalog lengkap aplikasi iOS modifikasi & tweak terbaru. Bergabunglah dengan grup Telegram eksklusif untuk mendapatkan file `.ipa`.
    </p>
    <a href="https://t.me/username_grup_kamu" target="_blank" 
       class="inline-block mt-4 px-6 py-2.5 rounded-full bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm transition shadow-lg shadow-blue-500/30">
      💬 Join Premium Telegram Group
    </a>
  </header>

  <!-- Search Bar -->
  <div class="mb-8 max-w-md mx-auto">
    <input type="text" id="searchInput" onkeyup="filterApps()" placeholder="Cari nama aplikasi atau fitur mod..." 
           class="w-full px-4 py-3 rounded-xl glass-card text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 transition text-sm">
  </div>

  <!-- App Grid -->
  <div id="catalogGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <!-- Grid items will be rendered by JS -->
  </div>

  <script>
    let allApps = [];

    async function loadCatalog() {
      try {
        const res = await fetch('/data/apps.json');
        allApps = await res.json();
        renderCatalog(allApps);
      } catch (err) {
        console.error("Gagal memuat catalog:", err);
      }
    }

    function renderCatalog(apps) {
      const grid = document.getElementById('catalogGrid');
      grid.innerHTML = apps.map(app => `
        <div class="glass-card rounded-2xl p-5 flex flex-col justify-between hover:border-blue-500/50 transition">
          <div>
            <div class="flex items-center gap-4 mb-4">
              <img src="${app.thumbnail || 'https://via.placeholder.com/60'}" 
                   class="w-14 h-14 rounded-2xl object-cover border border-white/10 shadow-md">
              <div>
                <h3 class="font-bold text-lg text-white leading-snug">${app.app_name}</h3>
                <span class="text-xs px-2.5 py-0.5 rounded-full bg-blue-500/20 text-blue-300 border border-blue-500/30">v${app.version}</span>
                <span class="text-xs text-slate-400 ml-1">iOS ${app.min_ios}+</span>
              </div>
            </div>

            ${app.modified ? `
              <div class="mb-3">
                <span class="text-xs text-slate-400 font-medium">Modified:</span>
                <p class="text-sm font-semibold text-emerald-400">${app.modified}</p>
              </div>
            ` : ''}

            ${app.modified_by ? `
              <p class="text-xs text-slate-400 mb-2">• Modded by: <span class="text-slate-200">${app.modified_by}</span></p>
            ` : ''}

            ${app.note ? `
              <div class="mt-3 p-3 rounded-xl bg-black/20 text-xs text-slate-300 whitespace-pre-wrap max-h-36 overflow-y-auto border border-white/5">
                ${app.note}
              </div>
            ` : ''}
          </div>

          <div class="mt-4 pt-3 border-t border-white/10 flex justify-between items-center text-xs text-slate-400">
            <span>Updated: ${app.updated_at}</span>
            <a href="https://t.me/username_grup_kamu" class="text-blue-400 hover:underline font-medium">Get IPA ➔</a>
          </div>
        </div>
      `).join('');
    }

    function filterApps() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allApps.filter(app => 
        app.app_name.toLowerCase().includes(query) || 
        (app.modified && app.modified.toLowerCase().includes(query)) ||
        (app.note && app.note.toLowerCase().includes(query))
      );
      renderCatalog(filtered);
    }

    loadCatalog();
  </script>
</body>
</html>
